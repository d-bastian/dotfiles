# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Gruvbox Material Dark Hard
include current-theme.conf
# END_KITTY_THEME

# BEGIN CURSOR SHAPE
cursor_shape block
# END CURSOR SHAPE

# BEGIN CELLS
modify_font cell_height 10px
# END CELLS

# BEGIN TABS
tab_bar_edge    top
tab_bar_style   powerline
tab_powerline_style angled
# END TABS

# BEGIN MAPPINGS
# Tab switching
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# Enable splits
enabled_layouts splits

# Split windows
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Navigate between splits
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down

# Resize splits
map cmd+ctrl+left resize_window narrower 5
map cmd+ctrl+right resize_window wider 5
map cmd+ctrl+up resize_window taller 5
map cmd+ctrl+down resize_window shorter 5

# Close current split
map cmd+w close_window
# END MAPPINGS

# BEGIN ENV VARIABLES
env PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
# END ENV VARIABLES
